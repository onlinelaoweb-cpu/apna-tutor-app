<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3358">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>Mini Champs - Apna Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout concept: a tidy practice workbook. One calm column, big tap targets,
   and a score strip on every game card that shows exactly what to beat next. */
:root{
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --bg:#EDF2F8; --surface:#FFFFFF; --surface2:#E2EAF4; --ink:#14213D; --ink2:#4A5A78; --line:#C9D5E5;
  --green:#0A7F58; --green-soft:#D5EFE4; --rose:#C2255C; --rose-soft:#F9DCE7; --on-accent:#FFFFFF;
  --good:#0A6B4A; --good-bg:#DDF3E9; --bad:#A32014; --bad-bg:#FDE7E2;
  --pad-red:#D9373B; --pad-blue:#3452C9; --pad-yellow:#E8A800; --pad-green:#238A5A; --on-pad:#FFFFFF;
  --accent:var(--green); --accent-soft:var(--green-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#172036; --surface2:#1F2B47; --ink:#E8EEFF; --ink2:#A7B4D2; --line:#2C3C60;
    --green:#46D993; --green-soft:#16382C; --rose:#FF84B1; --rose-soft:#3D1D2D; --on-accent:#0E1424;
    --good:#46D993; --good-bg:#14352A; --bad:#FF9D8F; --bad-bg:#3A1D1A;
    --pad-red:#F0686B; --pad-blue:#6E86F0; --pad-yellow:#F2BC2F; --pad-green:#43C183; --on-pad:#0E1424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172036; --surface2:#1F2B47; --ink:#E8EEFF; --ink2:#A7B4D2; --line:#2C3C60;
  --green:#46D993; --green-soft:#16382C; --rose:#FF84B1; --rose-soft:#3D1D2D; --on-accent:#0E1424;
  --good:#46D993; --good-bg:#14352A; --bad:#FF9D8F; --bad-bg:#3A1D1A;
  --pad-red:#F0686B; --pad-blue:#6E86F0; --pad-yellow:#F2BC2F; --pad-green:#43C183; --on-pad:#0E1424;
  color-scheme:dark;
}
#app[data-who="vardaan"]{--accent:var(--green);--accent-soft:var(--green-soft)}
#app[data-who="vedika"]{--accent:var(--rose);--accent-soft:var(--rose-soft)}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--font-body);
  padding-block:10px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#screen:focus{outline:none}
p,h2,h3{margin:0}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin:0;font:800 26px/1 var(--font-display)}
.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:21px;height:21px;fill:var(--on-accent)}
.snd{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.btn{min-height:56px;padding:0 22px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:800 20px/1 var(--font-display)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{width:100%;min-height:66px;font-size:25px}
.ghost{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:700}

.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whobtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left}
.wn{font:800 24px/1.1 var(--font-display)}
.ws{font-size:14px;color:var(--ink2)}
.whobtn[aria-selected="true"] .ws{color:inherit;opacity:.9}
.whobtn[data-v="vardaan"][aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.whobtn[data-v="vedika"][aria-selected="true"]{background:var(--rose);border-color:var(--rose);color:var(--on-accent)}

.goal{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.goal .gtxt{font:800 21px/1.2 var(--font-display)}
.goal .streak{grid-column:1/-1;color:var(--ink2);font-size:15px}
.dots3{display:flex;gap:8px}
.dots3 i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:transparent}
.dots3 i.on{background:var(--accent);border-color:var(--accent)}

.list{display:flex;flex-direction:column;gap:10px}
.sechead{font:800 20px/1.2 var(--font-display);margin-top:4px}
.sechead.muted{color:var(--ink2);font-size:17px;margin-top:10px}
.gcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left}
.gcard.other{opacity:.85}
.tile{width:58px;height:58px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 19px/1 var(--font-display);text-align:center}
.tile svg{width:30px;height:30px;fill:var(--accent)}
.gtext{display:flex;flex-direction:column;min-width:0}
.gtext b{font:800 21px/1.15 var(--font-display)}
.gtext small{font-size:15px;color:var(--ink2)}
.gbest{text-align:right;font-size:12px;line-height:1.2;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.gbest b{display:block;font:800 18px/1.2 var(--font-display);color:var(--ink);letter-spacing:0;text-transform:none}

.back{align-self:flex-start}
.title2{font:800 32px/1.1 var(--font-display)}
.tip{padding:14px 16px;border-radius:16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:4px}
.tip .eyebrow{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:800 18px/1 var(--font-display)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lvdesc{color:var(--ink2);font-size:15px}
.bestline{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700}

.qhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.pcount{font:800 20px/1 var(--font-display);text-align:center}
.timer{font:800 20px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink2);min-width:56px;text-align:right}
.meter{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .25s}
.qcard{min-height:200px;padding:20px 16px;border-radius:22px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.qprompt{font:800 clamp(24px,6.4vw,32px)/1.25 var(--font-display);text-wrap:balance}
.eq{font:800 clamp(36px,11vw,56px)/1.1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seq span{min-width:52px;padding:6px 10px;border-radius:12px;background:var(--surface2);font:800 clamp(26px,8vw,36px)/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.seq span.blank,.word .blank{background:var(--accent-soft);color:var(--accent);border:2px dashed var(--accent)}
.clue{font-size:18px;color:var(--ink2)}
.word{display:flex;gap:8px;justify-content:center}
.word span{min-width:48px;padding:4px 8px;border-radius:12px;background:var(--surface2);font:800 clamp(30px,9vw,42px)/1.2 var(--font-display)}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px}
.cell{aspect-ratio:1;display:grid;place-items:center}
.cell svg{width:76%;height:76%;fill:var(--accent)}
.bigshape{width:130px;height:130px;fill:var(--accent)}

.opts{display:grid;gap:10px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c2,.opts.c4{grid-template-columns:repeat(2,1fr)}
.opt{min-height:74px;padding:6px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:800 clamp(22px,6.5vw,30px)/1.1 var(--font-display)}
.opt.ok,.ansbox.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad,.ansbox.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.ansbox{min-height:68px;border-radius:16px;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;font:800 40px/1 var(--font-display);font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:800 26px/1 var(--font-display)}
.key.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:20px}
.key.sm{font-size:18px}
.fb:empty{display:none}
.fb{padding:14px 16px;border-radius:16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-bg);color:var(--good);font-weight:700;font-size:19px}
.fb.bad{background:var(--bad-bg);color:var(--ink)}
.fb.bad b{color:var(--bad);font-size:20px}

.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.stars{display:flex;gap:8px;justify-content:center}
.stars svg{width:58px;height:58px;fill:var(--surface2);stroke:var(--line);stroke-width:3}
.stars svg.on{fill:var(--pad-yellow);stroke:var(--pad-yellow)}
.score{font:800 64px/1 var(--font-display);font-variant-numeric:tabular-nums}
.newbest{padding:6px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:800 17px/1.2 var(--font-display)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

.status{font:800 24px/1.2 var(--font-display);text-align:center;min-height:30px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{aspect-ratio:1;border:0;border-radius:22px;background:var(--pc);display:grid;place-items:center;opacity:.92;transition:filter .1s,transform .1s}
.pad svg{width:46%;height:46%;fill:var(--on-pad)}
.pad[data-c="0"]{--pc:var(--pad-red)}
.pad[data-c="1"]{--pc:var(--pad-blue)}
.pad[data-c="2"]{--pc:var(--pad-yellow);--on-pad:#1A1400}
.pad[data-c="3"]{--pc:var(--pad-green)}
.pad.wait{opacity:.55}
.pad.lit{opacity:1;filter:brightness(1.3);transform:scale(.97);outline:6px solid var(--ink);outline-offset:-6px}
.foot{font-size:13px;color:var(--ink2);text-align:center}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.badge{padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:15px;border:2px solid var(--accent)}
.hi{display:block;font:800 clamp(34px,10vw,48px)/1.2 var(--font-body)}
.qprompt .clue{display:block}
.emoji{font-size:84px;line-height:1}
.swatch{width:120px;height:120px;color:var(--ink)}
.opts.c1{grid-template-columns:1fr}
.clock{width:min(220px,62vw);height:auto}
.clock .face{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.clock text{fill:var(--ink);font:800 12px var(--font-display);text-anchor:middle;dominant-baseline:central}
.clock line{stroke-linecap:round}
.clock .hh{stroke:var(--ink);stroke-width:7}
.clock .mh{stroke:var(--accent);stroke-width:4}
.clock .pin{fill:var(--ink)}
.cert{padding:24px 16px;border-radius:22px;border:6px double var(--accent);background:var(--surface);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.cert .score{font-size:44px}
.certname{font:800 40px/1.1 var(--font-display);color:var(--accent)}
.cert .stars svg{width:44px;height:44px}
.pcard{padding:14px 16px;border-radius:18px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pcard h3{font:800 24px/1.1 var(--font-display)}
.pcard h3 small{font:400 15px var(--font-body);color:var(--ink2)}
.pc-vardaan h3{color:var(--green)}
.pc-vedika h3{color:var(--rose)}
.prow{display:flex;justify-content:space-between;gap:10px;font-size:16px;border-top:1px solid var(--line);padding-top:6px}
.prow span{min-width:0}
.weak{padding:10px 12px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:700}
@media (prefers-reduced-motion:reduce){.pad,.meter i{transition:none}.pad.lit{transform:none}}
.tutorlink{align-self:flex-start;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
</style>


</head>
<body>
<div class="app" id="app" data-who="vardaan">
  <a class="ghost tutorlink" href="/">← Apna Tutor</a>
  <header class="bar-top">
    <h1 class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100"><polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38"/></svg></span>Mini Champs</h1>
    <button class="snd" id="snd" type="button" aria-pressed="true">Awaaz: On</button>
  </header>
  <main id="screen" tabindex="-1"></main>
  <p class="foot">Scores sirf is phone ke browser mein save hote hain.</p>
</div>

<script>
(function(){
'use strict';
var N=10;
var rnd=function(a,b){return a+Math.floor(Math.random()*(b-a+1));};
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
var range=function(a,b){var r=[];for(var i=a;i<=b;i++)r.push(i);return r;};

function numOptions(c,count,min,max){
  var set=[c];
  var near=shuffle([c-1,c+1,c-2,c+2,c-3,c+3,c-4,c+4]).filter(function(x){return x>=min&&x<=max;});
  near.forEach(function(x){if(set.length<count&&set.indexOf(x)<0)set.push(x);});
  var g=0;while(set.length<count&&g++<60){var x=rnd(min,max);if(set.indexOf(x)<0)set.push(x);}
  return shuffle(set);
}
function letterOptions(c,count){
  var all='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');var set=[c];
  shuffle(all).forEach(function(l){if(set.length<count&&set.indexOf(l)<0)set.push(l);});
  return shuffle(set);
}
var SHAPES={
  circle:{name:'Circle',svg:'<circle cx="50" cy="50" r="38"/>',fact:'Circle gol hota hai. Isme koi kona nahi hota.'},
  square:{name:'Square',svg:'<rect x="14" y="14" width="72" height="72" rx="3"/>',fact:'Square ki 4 sides barabar hoti hain aur 4 kone hote hain.'},
  triangle:{name:'Triangle',svg:'<polygon points="50,10 92,86 8,86"/>',fact:'Triangle ki 3 sides aur 3 kone hote hain.'},
  rectangle:{name:'Rectangle',svg:'<rect x="6" y="28" width="88" height="44" rx="3"/>',fact:'Rectangle ki 4 sides hoti hain: 2 lambi aur 2 chhoti.'},
  star:{name:'Star',svg:'<polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38"/>',fact:'Star mein 5 nok hoti hain.'}
};
function shapeSVG(id,cls){return '<svg viewBox="0 0 100 100" class="'+(cls||'shape')+'" aria-hidden="true">'+SHAPES[id].svg+'</svg>';}
function choiceOpts(arr){return arr.map(function(o){return {label:String(o),value:String(o)};});}

/* ---------- question generators ---------- */
function genCount(){
  var n=rnd(1,10),sh=pick(['star','circle','triangle','square']);
  var cells=shuffle(range(0,9)).slice(0,n),h='';
  for(var i=0;i<10;i++)h+=cells.indexOf(i)>=0?'<span class="cell">'+shapeSVG(sh)+'</span>':'<span class="cell"></span>';
  return {kind:'choice',visual:'<div class="dots">'+h+'</div>',prompt:'Kitne hain? Ginke batao.',
    options:choiceOpts(numOptions(n,3,1,10)),answer:String(n),
    explain:'Ek-ek karke ginte hain: '+range(1,n).join(', ')+'. Total '+n+' hain.'};
}
var LETTER_WORDS=[['Apple','A'],['Ball','B'],['Cat','C'],['Dog','D'],['Egg','E'],['Fish','F'],['Goat','G'],['Hen','H'],['Ink','I'],['Jug','J'],['Kite','K'],['Lion','L'],['Moon','M'],['Nest','N'],['Owl','O'],['Pen','P'],['Queen','Q'],['Rat','R'],['Sun','S'],['Tree','T'],['Umbrella','U'],['Van','V'],['Web','W'],['Yak','Y'],['Zebra','Z']];
function genLetters(){
  var p=pick(LETTER_WORDS);
  return {kind:'choice',visual:'',prompt:'<b>'+p[0]+'</b> ka pehla letter kaun sa hai?',
    options:choiceOpts(letterOptions(p[1],3)),answer:p[1],
    explain:p[1]+' for '+p[0]+'. '+p[0]+' ka pehla letter '+p[1]+' hai.'};
}
function genShapes(){
  var ids=Object.keys(SHAPES),id=pick(ids);
  var names=shuffle(ids.filter(function(x){return x!==id;})).slice(0,2).concat([id]).map(function(x){return SHAPES[x].name;});
  return {kind:'choice',visual:shapeSVG(id,'bigshape'),prompt:'Ye kaunsi shape hai?',
    options:choiceOpts(shuffle(names)),answer:SHAPES[id].name,explain:SHAPES[id].fact};
}
function genNext(){
  var t=pick(['after','before','between']),n,ans,prompt,explain;
  if(t==='after'){n=rnd(1,19);ans=n+1;prompt='<b>'+n+'</b> ke <b>baad</b> kaun sa number aata hai?';explain=n+', '+ans+'. Ginti mein '+n+' ke baad '+ans+' aata hai.';}
  else if(t==='before'){n=rnd(2,20);ans=n-1;prompt='<b>'+n+'</b> se <b>pehle</b> kaun sa number aata hai?';explain=ans+', '+n+'. Ginti mein '+n+' se pehle '+ans+' aata hai.';}
  else{n=rnd(1,18);ans=n+1;prompt=n+', <b>?</b>, '+(n+2)+'<br>Beech mein kya aayega?';explain=n+', '+ans+', '+(n+2)+'. Beech mein '+ans+' aata hai.';}
  return {kind:'choice',visual:'',prompt:prompt,options:choiceOpts(numOptions(ans,3,1,20)),answer:String(ans),explain:explain};
}
function genBigger(){
  var a=rnd(1,20),b=rnd(1,20);while(b===a)b=rnd(1,20);
  var big=Math.max(a,b),small=Math.min(a,b),askBig=Math.random()<0.5;
  return {kind:'choice',visual:'',prompt:'Kaun sa number <b>'+(askBig?'bada':'chhota')+'</b> hai?',
    options:choiceOpts(shuffle([a,b])),answer:String(askBig?big:small),
    explain:big+' bada hai aur '+small+' chhota hai. Ginti mein '+small+' pehle aata hai, '+big+' baad mein.'};
}
function genAddSub(level){
  var op=Math.random()<0.5?'+':'-',a=0,b=0,t1,t2,u1,u2,k;
  if(level===1){
    if(op==='+'){u1=rnd(0,8);u2=rnd(0,9-u1);t1=rnd(1,7);t2=rnd(1,8-t1);a=10*t1+u1;b=10*t2+u2;}
    else{t1=rnd(2,9);u1=rnd(0,9);t2=rnd(1,t1-1);u2=rnd(0,u1);a=10*t1+u1;b=10*t2+u2;}
  }else if(level===2){
    if(op==='+'){for(k=0;k<300;k++){a=rnd(15,89);b=rnd(15,89);if((a%10)+(b%10)>=10&&a+b<=150)break;}}
    else{for(k=0;k<300;k++){a=rnd(21,99);b=rnd(11,a-1);if((a%10)<(b%10)&&a>b)break;}}
  }else{
    if(op==='+'){a=rnd(100,899);b=rnd(10,99);}else{a=rnd(120,999);b=rnd(10,99);}
  }
  var ans=op==='+'?a+b:a-b,bt=b-(b%10),bo=b%10,m=op==='+'?a+bt:a-bt,sym=op==='+'?'+':'−';

  }

}

function freshP(){return {best:{},days:{},stat:{},badges:{},wrong:[],tc:0,tr:0,perf:0,s3:0,speedMax:0,voice:null};}
function freshState(){return {v:1,who:'vardaan',sound:true,lvl:{},mode:{},p:{vardaan:freshP(),vedika:freshP()}};}
function load(){
  try{var j=JSON.parse(localStorage.getItem(KEY)||'null');
    if(j&&j.v===1&&j.p&&j.p.vardaan&&j.p.vedika){
      j.lvl=j.lvl||{};j.mode=j.mode||{};
      ['vardaan','vedika'].forEach(function(k){var d=freshP(),p=j.p[k];Object.keys(d).forEach(function(f){if(p[f]===undefined)p[f]=d[f];});});

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function voiceOn(){var v=S.p[S.who].voice;return v===null?S.who==='vardaan':!!v;}
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayKey(){return keyOf(new Date());}
function calcStreak(st){var d=new Date(),n=0;if(!(st.days[keyOf(d)]>0))d.setDate(d.getDate()-1);
  while(st.days[keyOf(d)]>0){n++;d.setDate(d.getDate()-1);}return n;}
function better(a,b){return a.c>b.c||(a.c===b.c&&a.ms<b.ms);}
function bestAny(who,g){
  var best=null,b=S.p[who].best;
  Object.keys(b).forEach(function(k){if(k.indexOf(g+':')===0&&k.split(':').length===2&&(!best||better(b[k],best)))best=b[k];});
  return best;
}
function fmtBest(g,r){if(!r)return '—';return GAMES[g].memory?r.c+' step':r.c+'/'+N;}
function fmtTime(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function levelLabel(g,level){var G=GAMES[g];if(!G.levels)return '';var l=G.levels.filter(function(x){return x.id===level;})[0];return l?l.label:'';}
function starsOf(g,c,speed){
  if(GAMES[g].memory)return c>=8?3:c>=5?2:c>=2?1:0;
  if(speed)return c>=10?3:c>=6?2:c>=3?1:0;
  return c>=9?3:c>=6?2:c>=3?1:0;
}
var BADGES=[['streak3','3 din ka streak'],['streak7','7 din ka streak'],['rounds10','10 rounds poore'],['c100','100 sahi jawab'],['c500','500 sahi jawab'],['perfect','Ek round mein 10/10'],['star3','3 stars mile'],['speed10','Speed: 10 sahi'],['explorer','5 alag games khele']];
function badgeOk(id,st){
  switch(id){
    case 'streak3':return calcStreak(st)>=3;
    case 'streak7':return calcStreak(st)>=7;
    case 'rounds10':return st.tr>=10;
    case 'c100':return st.tc>=100;
    case 'c500':return st.tc>=500;
    case 'perfect':return st.perf>=1;
    case 'star3':return st.s3>=1;
    case 'speed10':return st.speedMax>=10;
    case 'explorer':return Object.keys(st.stat).filter(function(k){return st.stat[k].a>0;}).length>=5;
  }
  return false;
}
function checkBadges(who){
  var st=S.p[who],nw=[];
  BADGES.forEach(function(b){if(!st.badges[b[0]]&&badgeOk(b[0],st)){st.badges[b[0]]=todayKey();nw.push(b[1]);}});
  return nw;
}
function record(who,g,level,res,speed){
  var st=S.p[who],k=todayKey();
  st.days[k]=(st.days[k]||0)+1;st.tr++;
  var key=g+':'+level+(speed?':s':''),old=st.best[key],isBest=false;
  if(res.c>0&&(!old||better(res,old))){st.best[key]=res;isBest=true;}
  if(!speed&&!GAMES[g].memory&&res.c===N)st.perf++;
  if(speed&&res.c>st.speedMax)st.speedMax=res.c;
  if(starsOf(g,res.c,speed)===3)st.s3++;
  var nb=checkBadges(who);save();
  return {isBest:isBest,old:old,nb:nb};
}

function startQuiz(){

  if(!speed){
    var pend=S.p[S.who].wrong.filter(function(w){return w.g===g&&w.level===level;}).slice(0,3);
    var pos=shuffle(range(2,N-1));

  }

function showEntry(){var a=document.getElementById('ans');if(a)a.textContent=cur.entry===''?'?':cur.entry;}
function answer(val,btn){
  if(!cur||cur.locked)return;
  var q=cur.qs[cur.i];if(q.kind==='number'&&String(val)==='')return;
  cur.locked=true;
  var ok=String(Number(val))===q.answer||String(val)===q.answer;
  var P=S.p[S.who],s=P.stat[cur.g]||(P.stat[cur.g]={a:0,c:0});
  s.a++;if(ok){s.c++;P.tc++;}
  if(!cur.speed){
    var ix=-1;P.wrong.forEach(function(w,j){if(w.g===cur.g&&w.level===cur.level&&w.q.key===q.key)ix=j;});
    if(ok&&ix>=0&&q.retry)P.wrong.splice(ix,1);
    else if(!ok&&ix<0){
      P.wrong.push({g:cur.g,level:cur.level,q:{kind:q.kind,visual:q.visual,prompt:q.prompt,options:q.options,answer:q.answer,explain:q.explain,key:q.key}});
      if(P.wrong.length>30)P.wrong.shift();
    }
  }
  save();
  var fb=document.getElementById('fb');

    Array.prototype.forEach.call($screen.querySelectorAll('.opt'),function(b){if(b.getAttribute('data-v')===q.answer)b.classList.add('ok');});

    '<p class="score">'+(r.memory?r.c+' step':r.speed?r.c+' sahi':r.c+' / '+N)+'</p>'+
    (r.memory?'':r.speed?'<p class="timer">60 second mein</p>':'<p class="timer">Time: '+fmtTime(r.ms)+'</p>')+
    (r.isBest?'<p class="newbest">Naya best!</p>':'')+
    (r.nb&&r.nb.length?'<div class="chips">'+r.nb.map(function(b){return '<span class="badge">Naya badge: '+b+'</span>';}).join('')+'</div>':'')+
    '<p class="qprompt">'+msg+'</p>'+
    '<p class="lvdesc">Best: '+(r.speed?(best?best.c+' sahi':'—'):fmtBest(r.g,best)+(best&&!r.memory?' · '+fmtTime(best.ms):''))+'</p>'+
    (r.isBest?'<button class="btn big" type="button" data-act="cert">Certificate dekho</button>':'')+
    '<div class="row2"><button class="btn primary" type="button" data-act="again">Phir se</button><button class="btn" type="button" data-act="home">Ghar</button></div></div>';
  setScreen(h);
}
function renderCert(){
  var r=lastResult;if(!r){renderHome();return;}
  view='cert';
  var score=r.memory?r.c+' step':r.speed?r.c+' sahi (60 second)':r.c+' / '+N+' · '+fmtTime(r.ms);
  var h='<div class="list"><div class="cert"><p class="eyebrow">Mini Champs</p><h2 class="title2">Champion Certificate</h2><p>Ye certificate diya jata hai</p>'+
    '<p class="certname">'+PROFILE[S.who].name+'</p><p>ko <b>'+titleOf(r)+'</b> mein naya best banane ke liye</p>'+
    starsHTML(starsOf(r.g,r.c,r.speed))+'<p class="score">'+score+'</p>'+
    '<p class="lvdesc">'+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+'</p></div>'+
    '<p class="lvdesc">Screenshot lekar family ko bhej do.</p>'+
    '<div class="row2"><button class="btn primary" type="button" data-act="backres">Wapas</button><button class="btn" type="button" data-act="home">Ghar</button></div></div>';
  setScreen(h);
}
function renderParent(){
  clearTimers();stopSay();view='parent';
  var h='<div class="list"><button class="ghost back" type="button" data-act="home">← Ghar</button><h2 class="title2">Parent view</h2><p class="lvdesc">Ye data sirf is phone ke browser ka hai.</p>';
  Object.keys(PROFILE).forEach(function(k){
    var st=S.p[k],P=PROFILE[k],A=0,C=0,rows=[],weak=[];
    Object.keys(st.stat).forEach(function(g){
      var s=st.stat[g];if(!GAMES[g]||!s.a)return;
      A+=s.a;C+=s.c;rows.push({g:g,a:s.a,c:s.c,p:Math.round(100*s.c/s.a)});
      if(s.a>=10&&s.c/s.a<0.7)weak.push(GAMES[g].name);
    });
    rows.sort(function(x,y){return x.p-y.p;});
    function row(a,b){return '<div class="prow"><span>'+a+'</span><b>'+b+'</b></div>';}
    h+='<section class="pcard pc-'+k+'"><h3>'+P.name+' <small>'+P.sub+'</small></h3>'+
      row('Aaj ke rounds',st.days[todayKey()]||0)+row('Streak',calcStreak(st)+' din')+row('Total rounds',st.tr)+
      row('Sahi jawab',C+' / '+A+(A?' ('+Math.round(100*C/A)+'%)':''))+
      row('Galat sawal (dobara aayenge)',st.wrong.length)+row('Badges',Object.keys(st.badges).length+' / '+BADGES.length)+
      (weak.length?'<p class="weak">Practice chahiye: '+weak.join(', ')+'</p>':'')+
      (rows.length?'<p class="eyebrow">Games (kamzor pehle)</p>'+rows.map(function(x){return row(GAMES[x.g].name,x.c+'/'+x.a+' · '+x.p+'%');}).join(''):'<p class="lvdesc">Abhi koi data nahi.</p>')+
      '</section>';
  });
  h+='</div>';
  setScreen(h);
}

/* ---------- events ---------- */
$screen.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  if(a==='who'){S.who=v;save();renderHome();}
  else if(a==='game'){renderIntro(b.getAttribute('data-g'));}
  else if(a==='lvl'){S.lvl[cur.g]=Number(v);save();renderIntro(cur.g);}
  else if(a==='mode'){S.mode[cur.g]=v;save();renderIntro(cur.g);}
  else if(a==='start'){startQuiz();}
  else if(a==='home'){renderHome();}
  else if(a==='opt'){answer(v,b);}
  else if(a==='key'){
    if(!cur||cur.locked)return;
    if(v==='del')cur.entry=cur.entry.slice(0,-1);
    else if(v==='ok')answer(cur.entry);
    else if(cur.entry.length<4)cur.entry+=v;
    showEntry();
  }
  else if(a==='next'){nextQuestion();}
  else if(a==='say'){if(cur&&cur.qs)say(plain(cur.qs[cur.i].prompt));}
  else if(a==='again'){cur={g:lastPlay.g,level:lastPlay.level,mode:lastPlay.mode};startQuiz();}
  else if(a==='pad'){pressPad(Number(v));}
  else if(a==='voice'){S.p[S.who].voice=!voiceOn();save();renderHome();}
  else if(a==='parent'){renderParent();}
  else if(a==='cert'){renderCert();}
  else if(a==='backres'){if(lastResult)renderResult(lastResult);else renderHome();}
});
document.addEventListener('keydown',function(e){
  if(view!=='quiz'||!cur)return;
  var q=cur.qs[cur.i];
  if(cur.waiting&&e.key==='Enter'){e.preventDefault();nextQuestion();return;}
  if(!q||q.kind!=='number'||cur.locked)return;
  if(/^[0-9]$/.test(e.key)){if(cur.entry.length<4){cur.entry+=e.key;showEntry();}}
  else if(e.key==='Backspace'){cur.entry=cur.entry.slice(0,-1);showEntry();}
  else if(e.key==='Enter'){answer(cur.entry);}
});
$snd.addEventListener('click',function(){S.sound=!S.sound;save();syncChrome();if(S.sound)tone(660,.12);});
renderHome();
})();
</script>
